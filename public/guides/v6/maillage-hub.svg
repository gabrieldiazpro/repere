<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">Maillage interne en grappes</title>
  <desc id="d">La page d’accueil mène à trois pages piliers. Chaque pilier mène à ses pages détaillées, qui renvoient vers leur pilier.</desc>
  <rect x="0.5" y="0.5" width="719" height="339" rx="14" fill="#ffffff" stroke="#d9dde3"/>
  <rect x="290" y="20" width="140" height="44" rx="10" fill="#1e1b4b"/>
  <text x="360" y="47" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Accueil</text>
  <g stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M330 64 L 140 118"/><path d="M360 64 L 360 118"/><path d="M390 64 L 580 118"/>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
  <g font-size="13" font-weight="600" fill="#1e1b4b">
    <rect x="70" y="120" width="140" height="40" rx="9" fill="#eef2ff" stroke="#4f46e5"/><text x="140" y="145" text-anchor="middle">Pilier : service 1</text>
    <rect x="290" y="120" width="140" height="40" rx="9" fill="#eef2ff" stroke="#4f46e5"/><text x="360" y="145" text-anchor="middle">Pilier : service 2</text>
    <rect x="510" y="120" width="140" height="40" rx="9" fill="#eef2ff" stroke="#4f46e5"/><text x="580" y="145" text-anchor="middle">Pilier : service 3</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.2" fill="none" marker-start="url(#a)" marker-end="url(#a)">
    <path d="M115 160 L 80 226"/><path d="M140 160 L 140 226"/><path d="M165 160 L 200 226"/>
    <path d="M335 160 L 300 226"/><path d="M360 160 L 360 226"/><path d="M385 160 L 420 226"/>
    <path d="M555 160 L 520 226"/><path d="M580 160 L 580 226"/><path d="M605 160 L 640 226"/>
  </g>
  <g fill="#f3f4f6" stroke="#9ca3af">
    <rect x="50" y="228" width="60" height="34" rx="7"/><rect x="110" y="228" width="60" height="34" rx="7"/><rect x="170" y="228" width="60" height="34" rx="7"/>
    <rect x="270" y="228" width="60" height="34" rx="7"/><rect x="330" y="228" width="60" height="34" rx="7"/><rect x="390" y="228" width="60" height="34" rx="7"/>
    <rect x="490" y="228" width="60" height="34" rx="7"/><rect x="550" y="228" width="60" height="34" rx="7"/><rect x="610" y="228" width="60" height="34" rx="7"/>
  </g>
  <text x="360" y="300" text-anchor="middle" font-size="13" fill="#374151">Pages détaillées : villes, réalisations, articles, produits</text>
  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#6b7280">Chacune reçoit un lien de son pilier et renvoie vers lui.</text>
</svg>
