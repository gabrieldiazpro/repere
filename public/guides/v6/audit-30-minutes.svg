<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">Audit SEO en 30 minutes</title>
  <desc id="d">Six contrôles de cinq minutes : indexation, robots, pages clés, titres, mobile et vitesse, balisage.</desc>
  <rect x="0.5" y="0.5" width="719" height="199" rx="14" fill="#ffffff" stroke="#d9dde3"/>
  <line x1="60" y1="86" x2="660" y2="86" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round"/>
  <g font-size="12" text-anchor="middle">
    <g transform="translate(60 0)"><circle cy="86" r="22" fill="#4f46e5"/><text y="91" fill="#fff" font-weight="600">0</text><text y="134" fill="#111827" font-weight="600">Indexation</text><text y="152" fill="#6b7280">site:</text></g>
    <g transform="translate(180 0)"><circle cy="86" r="22" fill="#4f46e5"/><text y="91" fill="#fff" font-weight="600">5</text><text y="134" fill="#111827" font-weight="600">Robots</text><text y="152" fill="#6b7280">robots.txt, noindex</text></g>
    <g transform="translate(300 0)"><circle cy="86" r="22" fill="#4f46e5"/><text y="91" fill="#fff" font-weight="600">10</text><text y="134" fill="#111827" font-weight="600">Pages clés</text><text y="152" fill="#6b7280">texte dans le HTML</text></g>
    <g transform="translate(420 0)"><circle cy="86" r="22" fill="#4f46e5"/><text y="91" fill="#fff" font-weight="600">15</text><text y="134" fill="#111827" font-weight="600">Titres</text><text y="152" fill="#6b7280">uniques, descriptifs</text></g>
    <g transform="translate(540 0)"><circle cy="86" r="22" fill="#4f46e5"/><text y="91" fill="#fff" font-weight="600">20</text><text y="134" fill="#111827" font-weight="600">Mobile</text><text y="152" fill="#6b7280">lisible, rapide</text></g>
    <g transform="translate(660 0)"><circle cy="86" r="22" fill="#4f46e5"/><text y="91" fill="#fff" font-weight="600">25</text><text y="134" fill="#111827" font-weight="600">Balisage</text><text y="152" fill="#6b7280">résultats enrichis</text></g>
  </g>
  <text x="360" y="38" text-anchor="middle" font-size="13" fill="#374151">Minutes écoulées : chaque étape suppose la précédente réglée</text>
</svg>
