<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">Pagination et filtres d’une catégorie</title>
  <desc id="d">Une catégorie paginée en pages 1, 2, 3 reliées par des liens explorables ; les combinaisons de filtres et de tris sont en général écartées de l’exploration.</desc>
  <rect x="0.5" y="0.5" width="719" height="319" rx="14" fill="#ffffff" stroke="#d9dde3"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
  <rect x="40" y="30" width="200" height="44" rx="9" fill="#1e1b4b"/>
  <text x="140.0" y="57.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Catégorie : sacs à dos</text>
  <rect x="40" y="120" width="100" height="40" rx="9" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="90.0" y="145.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">page 1</text>
  <rect x="160" y="120" width="100" height="40" rx="9" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="210.0" y="145.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">page 2</text>
  <rect x="280" y="120" width="100" height="40" rx="9" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="330.0" y="145.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">page 3</text>
  <path d="M140 140 L 158 140" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M260 140 L 278 140" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M140 74 L 90 118" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="40" y="190" text-anchor="start" font-size="12" fill="#374151">Adresse unique (?page=2), lien &lt;a href&gt;,</text>
  <text x="40" y="208" text-anchor="start" font-size="12" fill="#374151">canonique propre à chaque page.</text>
  <rect x="430" y="30" width="250" height="200" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="555" y="58" text-anchor="middle" font-size="13" fill="#1e1b4b" font-weight="600">Combinaisons de filtres</text>
  <text x="555" y="92" text-anchor="middle" font-size="12" fill="#6b7280">?couleur=rouge&amp;taille=m</text>
  <text x="555" y="118" text-anchor="middle" font-size="12" fill="#6b7280">?prix=50-100&amp;marque=x</text>
  <text x="555" y="144" text-anchor="middle" font-size="12" fill="#6b7280">?tri=prix-croissant</text>
  <text x="555" y="182" text-anchor="middle" font-size="12" fill="#4f46e5" font-weight="600">En général hors exploration</text>
  <text x="555" y="200" text-anchor="middle" font-size="12" fill="#4b5563">(robots.txt), 404 si vide</text>
  <path d="M240 52 L 428 80" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="360" y="280" text-anchor="middle" font-size="12" fill="#374151">Les combinaisons vraiment recherchées deviennent de vraies pages de catégorie.</text>
  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#6b7280">rel="prev/next" n’est plus utilisé par Google ; « Charger plus » doit garder des liens.</text>
</svg>
