  <path d="M440 142 L 498 142" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="360" y="300" text-anchor="middle" font-size="13" fill="#374151">Une fiche par lieu réel, reliée à la page de ce lieu ; les pages voisines se citent.</text>
  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#6b7280">Exemple fictif : les Boulangeries Lemaire.</text>
