  <rect x="500" y="222" width="160" height="44" rx="9" fill="#f3f4f6" stroke="#4f46e5"/>
  <text x="580.0" y="241.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">Fiche Google</text>
