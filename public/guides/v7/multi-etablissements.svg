<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">Réseau multi-établissements : pages et fiches</title>
  <desc id="d">La page « Nos boutiques » relie une page par établissement. Chaque page locale est reliée à sa propre fiche Google, et les pages voisines se citent entre elles.</desc>
  <rect x="0.5" y="0.5" width="719" height="339" rx="14" fill="#ffffff" stroke="#d9dde3"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
  <rect x="270" y="20" width="180" height="44" rx="9" fill="#1e1b4b"/>
  <text x="360.0" y="47.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Page « Nos boutiques »</text>
  <path d="M360 64 L 140 118" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="60" y="120" width="160" height="44" rx="9" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="140.0" y="139.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">Boutique Croix-Rousse</text>
  <text x="140.0" y="156.0" text-anchor="middle" font-size="11" fill="#4b5563">page locale</text>
  <path d="M140 164 L 140 220" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="60" y="222" width="160" height="44" rx="9" fill="#f3f4f6" stroke="#4f46e5"/>
  <text x="140.0" y="241.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">Fiche Google</text>
  <text x="140.0" y="258.0" text-anchor="middle" font-size="11" fill="#4b5563">même nom, même catégorie</text>
  <path d="M360 64 L 360 118" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="280" y="120" width="160" height="44" rx="9" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="360.0" y="139.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">Boutique Villeurbanne</text>
  <text x="360.0" y="156.0" text-anchor="middle" font-size="11" fill="#4b5563">page locale</text>
  <path d="M360 164 L 360 220" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="280" y="222" width="160" height="44" rx="9" fill="#f3f4f6" stroke="#4f46e5"/>
  <text x="360.0" y="241.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">Fiche Google</text>
  <text x="360.0" y="258.0" text-anchor="middle" font-size="11" fill="#4b5563">même nom, même catégorie</text>
  <path d="M360 64 L 580 118" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="500" y="120" width="160" height="44" rx="9" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="580.0" y="139.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">Boutique Part-Dieu</text>
  <text x="580.0" y="156.0" text-anchor="middle" font-size="11" fill="#4b5563">page locale</text>
