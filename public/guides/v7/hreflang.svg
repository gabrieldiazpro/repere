<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">Balises hreflang réciproques</title>
  <desc id="d">Trois versions d’une page, fr-FR, fr-BE et en, se citent mutuellement ; une page x-default est proposée aux visiteurs dont la langue ne correspond à aucune version.</desc>
  <rect x="0.5" y="0.5" width="719" height="339" rx="14" fill="#ffffff" stroke="#d9dde3"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
  <rect x="60" y="40" width="190" height="56" rx="9" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="155.0" y="65.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">fr-FR</text>
  <text x="155.0" y="82.0" text-anchor="middle" font-size="11" fill="#4b5563">/fr/</text>
  <rect x="470" y="40" width="190" height="56" rx="9" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="565.0" y="65.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">fr-BE</text>
  <text x="565.0" y="82.0" text-anchor="middle" font-size="11" fill="#4b5563">/fr-be/</text>
  <rect x="265" y="190" width="190" height="56" rx="9" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="360.0" y="215.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">en</text>
  <text x="360.0" y="232.0" text-anchor="middle" font-size="11" fill="#4b5563">/en/</text>
  <path d="M250 68 L 468 68" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M155 96 L 300 188" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M565 96 L 420 188" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="500" y="250" width="180" height="50" rx="9" fill="#f3f4f6" stroke="#4f46e5"/>
  <text x="590.0" y="272.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">x-default</text>
  <text x="590.0" y="289.0" text-anchor="middle" font-size="11" fill="#4b5563">choix de la langue</text>
  <path d="M455 230 L 520 250" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="40" y="275" text-anchor="start" font-size="12" fill="#374151">Chaque version cite toutes les autres et elle-même,</text>
  <text x="40" y="295" text-anchor="start" font-size="12" fill="#374151">avec des adresses complètes en https.</text>
  <text x="40" y="320" text-anchor="start" font-size="12" fill="#6b7280">Pas de redirection automatique selon l’adresse IP.</text>
</svg>
