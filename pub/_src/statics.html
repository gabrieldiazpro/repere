<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Visuels Repéré</title>
<link rel="stylesheet" href="common.css">
<style>
  body { width: 1080px; }
  .ad { position: relative; width: 1080px; height: 1080px; overflow: hidden; padding: 64px 72px; display: flex; flex-direction: column; }
  .ad.p { height: 1350px; }
  .ad.light { background: var(--canvas); color: var(--ink); }
  .ad.light::before { display: none; }
  .head { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; }
  .light .brand { color: var(--ink); }
  .h1 { font: 700 70px/1.04 var(--display); letter-spacing: -.025em; margin-top: 44px; position: relative; z-index: 2; }
  .h1.l { font-size: 84px; }
  .sub { font: 500 34px/1.32 var(--sans); color: var(--on-deep); margin-top: 22px; position: relative; z-index: 2; }
  .light .sub { color: var(--muted); }
  .body { flex: 1; position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; padding: 30px 0; }
  .foot { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .cta { background: #fff; color: var(--primary); font: 700 36px/1 var(--sans); padding: 26px 38px; border-radius: 999px; box-shadow: 0 14px 40px rgba(0,0,0,.3); white-space: nowrap; }
  .cta b { color: var(--accent); }
  .light .cta { background: var(--primary); color: #fff; box-shadow: 0 14px 40px rgba(55,48,163,.3); }
  .url { font: 600 28px/1.25 var(--sans); color: var(--on-deep); text-align: right; }
  .light .url { color: var(--muted); }
  .legal { font: 500 20px/1.35 var(--sans); color: var(--on-deep); margin-top: 18px; position: relative; z-index: 2; opacity: .9; }
  .light .legal { color: var(--muted); }
  .card { background: #fff; color: var(--ink); border-radius: 28px; box-shadow: 0 24px 70px rgba(10,8,40,.35); }
  .light .card { box-shadow: 0 18px 50px rgba(27,31,46,.10); border: 1px solid var(--line); }
  .k { font: 700 22px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .mk { background-image: linear-gradient(var(--accent), var(--accent)); background-repeat: no-repeat; background-size: 100% .13em; background-position: 0 96%; }
  .q { color: var(--accent-soft); }
  .ok { color: var(--success); } .ko { color: var(--danger); }
  .stamp { position: absolute; z-index: 6; transform: rotate(-6deg); border: 5px solid var(--accent); color: #5B3A06; background: var(--accent-soft); font: 800 30px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 14px 22px; border-radius: 14px; }
  /* avant / après */
  .ba { display: grid; gap: 22px; }
  .ba .row { padding: 30px 34px; border-radius: 24px; }
  .ba .before { background: var(--danger-bg); border: 2px solid #F3C4C4; }
  .ba .after { background: var(--success-bg); border: 2px solid #B6E0C4; }
  .ba .lab { font: 700 24px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; }
  .ba .before .lab { color: var(--danger-ink); } .ba .after .lab { color: var(--success-ink); }
  .serp .t { font: 500 38px/1.25 var(--sans); color: #1a0dab; }
  .serp .u { font: 400 24px/1.3 var(--sans); color: #4d5156; margin-bottom: 6px; }
  .serp .d { font: 400 26px/1.4 var(--sans); color: #4d5156; margin-top: 8px; }
  .strike { text-decoration: line-through; text-decoration-thickness: 3px; color: #9b1c1c; }
  /* réponses IA */
  .ai { display: flex; gap: 22px; align-items: flex-start; padding: 26px 30px; }
  .ai + .ai { border-top: 1px solid var(--line); }
  .bubble { flex: none; width: 64px; height: 64px; border-radius: 18px; background: var(--primary-bg); display: grid; place-items: center; }
  .bubble svg { width: 36px; height: 36px; }
  .ai .n { font: 700 30px/1.1 var(--sans); }
  .ai .r { font: 400 26px/1.38 var(--sans); color: var(--muted); margin-top: 8px; }
  .badge { display: inline-flex; gap: 8px; align-items: center; font: 700 22px/1 var(--sans); padding: 10px 14px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .badge.ok { background: var(--success-bg); color: var(--success-ink); }
  .badge.ko { background: var(--danger-bg); color: var(--danger-ink); }
  .badge.wa { background: var(--warning-bg); color: var(--warning-ink); }
  .stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .stat3 .card { padding: 40px 28px; text-align: center; }
  .stat3 .v { font: 700 112px/1 var(--display); color: var(--primary); letter-spacing: -.03em; }
  .stat3 .l { font: 600 28px/1.25 var(--sans); color: var(--muted); margin-top: 14px; }
  .shot { position: relative; overflow: hidden; border-radius: 26px; background: #fff; box-shadow: 0 0 0 8px #0E0B33, 0 0 0 10px rgba(255,255,255,.14), 0 30px 90px rgba(0,0,0,.5); }
  .shot img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .bars .b { display: grid; grid-template-columns: 56px 1fr 90px; gap: 18px; align-items: center; padding: 9px 0; font: 600 30px/1 var(--sans); }
  .bars .b .rk { color: var(--muted); font-weight: 700; }
  .bars .track { height: 18px; border-radius: 9px; background: #E7E9F1; position: relative; margin-top: 12px; }
  .bars .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px; background: #A3A9BC; }
  .bars .me .track i { background: var(--primary); }
  .bars .me { color: var(--primary); }
  .bars .pc { text-align: right; color: var(--muted); }
  .funnel { display: grid; gap: 8px; }
  .funnel .st { display: flex; align-items: center; gap: 26px; padding: 18px 32px; }
  .funnel .v { font: 700 64px/1 var(--display); color: var(--primary); min-width: 250px; letter-spacing: -.02em; }
  .funnel .l { font: 600 30px/1.25 var(--sans); }
  .funnel .s { font: 400 23px/1.3 var(--sans); color: var(--muted); margin-top: 6px; }
  .arrow { text-align: center; color: var(--accent); font: 700 32px/1 var(--sans); }
  .score { display: flex; align-items: center; gap: 30px; }
  .gauge { width: 240px; height: 240px; position: relative; }
  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge .num { position: absolute; inset: 0; display: grid; place-items: center; font: 700 96px/1 var(--display); color: var(--ink); }
  .gauge .num small { display: block; font: 600 24px/1 var(--sans); color: var(--muted); text-align: center; margin-top: 6px; }
  .chk { display: grid; gap: 14px; font: 600 30px/1.25 var(--sans); }
  .chk div { display: flex; gap: 18px; align-items: center; }
  .chk .i { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: 800 26px/1 var(--sans); }
  .chk .y .i { background: var(--success-bg); color: var(--success-ink); }
  .chk .n .i { background: var(--danger-bg); color: var(--danger-ink); }
  .input { display: flex; gap: 0; background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.3); }
  .input .f { flex: 1; padding: 30px 32px; font: 500 36px/1 var(--sans); color: var(--ink); }
  .input .f span { display: inline-block; width: 3px; height: 40px; background: var(--primary); vertical-align: -8px; margin-left: 4px; }
  .input .b { background: var(--primary); color: #fff; font: 700 32px/1 var(--sans); padding: 30px 34px; }
</style>
</head>
<body>
<div id="root"></div>
