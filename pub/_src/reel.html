<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Reel Repéré</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { width: 1080px; height: 1920px; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .layer { position: absolute; inset: 0; will-change: opacity, transform; }
  .top-brand { position: absolute; left: 72px; top: 150px; z-index: 50; }
  .top-brand .brand { font-size: 36px; gap: 14px; }
  .top-brand svg { width: 50px; height: 50px; }
  /* Cartons texte */
  .card-text { position: absolute; left: 80px; right: 80px; top: 300px; height: 950px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .card-text .big { font: 700 104px/1.04 var(--display); letter-spacing: -.025em; }
  .card-text .big.m { font-size: 88px; }
  .card-text .big.s { font-size: 76px; }
  .card-text .sub { font: 500 44px/1.3 var(--sans); color: var(--on-deep); }
  .w { display: inline-block; opacity: 0; transform: translateY(34px); white-space: pre; }
  .q { color: var(--accent-soft); }
  .w.mot { background-image: linear-gradient(var(--accent), var(--accent)); background-repeat: no-repeat; background-size: calc(100% - .28em) .13em; background-position: 0 96%; }
  .red { color: #FCA5A5; }
  .green { color: #86EFAC; }
  /* Écran */
  .headline { position: absolute; left: 80px; right: 80px; top: 268px; height: 250px; display: flex; align-items: center; }
  .headline > div { position: absolute; left: 0; right: 0; font: 700 64px/1.08 var(--display); letter-spacing: -.02em; }
  .phone { position: absolute; left: 100px; top: 548px; width: 880px; height: 1440px; border-radius: 48px; background: #fff; overflow: hidden;
    box-shadow: 0 0 0 10px #0E0B33, 0 0 0 12px rgba(255,255,255,.14), 0 40px 120px rgba(0,0,0,.55); }
  .phone .shot { position: absolute; left: 0; top: 0; width: 720px; transform-origin: 0 0; }
  .phone img.seq { position: absolute; left: 0; top: 0; width: 720px; height: 1280px; transform-origin: 0 0; }
  .focus { position: absolute; border: 6px solid var(--accent); border-radius: 22px; box-shadow: 0 0 0 4000px rgba(20,16,70,.30); opacity: 0; z-index: 5; }
  .demo-tag { position: absolute; right: 128px; top: 516px; z-index: 20; }
  /* Fin */
  .end { position: absolute; left: 80px; right: 80px; top: 300px; height: 950px; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
  .end .logo svg { width: 132px; height: 132px; }
  .end .t { font: 700 92px/1.04 var(--display); letter-spacing: -.025em; }
  .end .cta { align-self: flex-start; background: #fff; color: var(--primary); font: 700 46px/1 var(--sans); padding: 34px 48px; border-radius: 999px; box-shadow: 0 18px 50px rgba(0,0,0,.35); display: flex; gap: 18px; align-items: center; }
  .end .cta b { color: var(--accent); font-size: 50px; }
  .end .url { font: 600 40px/1 var(--sans); color: var(--on-deep); }
  .end .legal { font-size: 25px; max-width: 900px; }
  .bottom-legal { position: absolute; left: 80px; right: 80px; top: 1262px; z-index: 30; font: 600 24px/1.3 var(--sans); color: #fff; opacity: .0; }
</style>
</head>
<body>
<div id="stage" class="bg-deep dots"></div>
<script src="footage/seq.js"></script>
<script src="reels.js"></script>
<script>
const LOGO = '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#3730A3"/><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 26V19a2 2 0 0 1 2-2h7"/><path d="M38 17h7a2 2 0 0 1 2 2v7"/><path d="M47 38v7a2 2 0 0 1-2 2h-7"/><path d="M26 47h-7a2 2 0 0 1-2-2v-7"/></g><circle cx="32" cy="32" r="7" fill="#F5A524"/></svg>';
const name = new URLSearchParams(location.search).get('r');
const R = window.REELS[name];
const stage = document.getElementById('stage');
const SC = 880 / 720;
const FADE = 0.32;
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const easeIO = (x) => { x = Math.min(1, Math.max(0, x)); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerpKeys = (keys, t) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb] = keys[i]; if (t <= b) return va + (vb - va) * easeIO((t - a) / (b - a || 1)); } return keys[keys.length - 1][1]; };
const lerpLin = (keys, t) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb] = keys[i]; if (t <= b) return va + (vb - va) * ((t - a) / (b - a || 1)); } return keys[keys.length - 1][1]; };

// Texte riche : *mot* = surligné, [q]…[/q] etc. via classes simples {c:texte}
function words(html) {
  // découpe en mots en conservant les balises span de couleur : syntaxe {cls|texte}
  const out = []; const re = /\{(\w+)\|([^}]*)\}|\*([^*]+)\*|(\S+)/g; let m;
  while ((m = re.exec(html))) {
    if (m[1]) m[2].split(' ').forEach((w) => out.push(`<span class="w ${m[1]}">${w} </span>`));
    else if (m[3]) m[3].split(' ').forEach((w, i, a) => out.push(`<span class="w"><span class="mark">${w}</span>${i < a.length - 1 ? ' ' : ' '}</span>`));
    else out.push(`<span class="w">${m[4]} </span>`);
  }
  return out.join('');
}
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

// Marque en haut, permanente
const tb = el('div', 'top-brand', `<div class="brand">${LOGO}<span>Repéré</span></div>`); stage.appendChild(tb);

const built = R.scenes.map((s) => {
  const layer = el('div', 'layer'); stage.appendChild(layer);
  const b = { s, layer, groups: [] };
  if (s.type === 'card') {
    const box = el('div', 'card-text'); layer.appendChild(box);
    s.blocks.forEach((bl) => { const d = el('div', bl.cls || 'big', words(bl.text)); box.appendChild(d); b.groups.push({ at: bl.at || 0, ws: [...d.querySelectorAll('.w')] }); });
  } else if (s.type === 'screen') {
    const hl = el('div', 'headline'); layer.appendChild(hl);
    b.caps = s.captions.map((c) => { const d = el('div', '', words(c.text)); hl.appendChild(d); return { c, d, ws: [...d.querySelectorAll('.w')] }; });
    const ph = el('div', 'phone'); layer.appendChild(ph);
    if (s.still) { const img = el('img', 'shot'); img.src = 'footage/stills/' + s.still + '.png'; ph.appendChild(img); b.img = img; }
    if (s.seq) { const img = el('img', 'seq'); ph.appendChild(img); b.seqImg = img; b.seqMeta = window.SEQ[s.seq]; }
    b.focus = (s.focus || []).map((f) => { const d = el('div', 'focus'); ph.appendChild(d); return { f, d }; });
    if (s.demo !== false) { const t = el('div', 'demo-tag', `<span class="demo-pill"><i></i>${s.demo || 'Démo · chiffres fictifs'}</span>`); layer.appendChild(t); }
  } else if (s.type === 'end') {
    const box = el('div', 'end'); layer.appendChild(box);
    const parts = [
      el('div', 'logo', LOGO), el('div', 't', words(s.title)),
      el('div', 'cta', `${s.cta} <b>→</b>`), el('div', 'url', s.url || 'repere-ia.fr'),
      el('div', 'legal', s.legal || 'Sans lien avec OpenAI, Google, Anthropic ou Perplexity. Aucun résultat garanti.'),
    ];
    parts.forEach((p) => box.appendChild(p)); b.parts = parts; b.tws = [...parts[1].querySelectorAll('.w')];
  }
  return b;
});

function animWords(ws, lt, at, step = 0.055, dur = 0.42) {
  ws.forEach((w, i) => { const k = ease((lt - at - i * step) / dur); w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 34}px)`; });
}

window.render = async function (t) {
  const waits = [];
  tb.style.opacity = R.brandFrom != null && t < R.brandFrom ? 0 : 1;
  for (const b of built) {
    const { s, layer } = b; const lt = t - s.start;
    const vis = lt > -FADE && lt < s.dur + FADE;
    layer.style.display = vis ? 'block' : 'none';
    if (!vis) continue;
    const fi = s.noFadeIn ? 1 : ease((lt + FADE) / FADE), fo = s.noFadeOut ? 1 : 1 - easeIO((lt - s.dur) / FADE);
    const o = Math.min(fi, fo);
    layer.style.opacity = o;
    layer.style.transform = `scale(${1 + (1 - fi) * 0.03})`;
    if (s.type === 'card') b.groups.forEach((g) => animWords(g.ws, lt, g.at));
    else if (s.type === 'screen') {
      // légendes : une à la fois, fondu enchaîné
      b.caps.forEach((cp, i) => {
        const end = i + 1 < b.caps.length ? b.caps[i + 1].c.at : 1e9;
        const out = 1 - ease((lt - end) / 0.2);
        const st = cp.c.at + (i > 0 ? 0.24 : 0);
        cp.d.style.opacity = lt < st - 0.01 ? 0 : out;
        animWords(cp.ws, lt, st, 0.045, 0.38);
      });
      const zoom = s.zoom ? lerpKeys(s.zoom, lt) : 1; const sc = SC * zoom;
      const zx = s.zoomX || 0;
      if (b.img) {
        const y = lerpKeys(s.scroll || [[0, 0]], lt);
        b.img.style.transform = `translate(${-zx * (zoom - 1) * 720 * SC}px, ${-y * sc}px) scale(${sc})`;
        if (!b.img.complete) waits.push(b.img.decode().catch(() => {}));
        b.focus.forEach(({ f, d }) => {
          const k = ease((lt - f.at) / 0.35) * (1 - ease((lt - (f.until ?? 1e9)) / 0.3));
          d.style.opacity = k;
          d.style.left = (f.x * sc - zx * (zoom - 1) * 720 * SC - 10) + 'px'; d.style.top = ((f.y - y) * sc - 10) + 'px';
          d.style.width = (f.w * sc + 20) + 'px'; d.style.height = (f.h * sc + 20) + 'px';
        });
      }
      if (b.seqImg) {
        const st = lerpLin(s.seqKeys, lt); const fr = b.seqMeta;
        let idx = 0; while (idx + 1 < fr.length && fr[idx + 1] <= st) idx++;
        const src = `footage/seq/${s.seq}/${String(idx).padStart(4, '0')}.jpg`;
        if (b.seqImg.dataset.src !== src) { b.seqImg.dataset.src = src; b.seqImg.src = src; waits.push(b.seqImg.decode().catch(() => {})); }
        const y = s.seqShift ? lerpKeys(s.seqShift, lt) : 0;
        b.seqImg.style.transform = `translate(${-zx * (zoom - 1) * 720 * SC}px, ${-y * sc}px) scale(${sc})`;
        b.focus.forEach(({ f, d }) => {
          const k = ease((lt - f.at) / 0.35) * (1 - ease((lt - (f.until ?? 1e9)) / 0.3));
          d.style.opacity = k; d.style.left = (f.x * sc - 10) + 'px'; d.style.top = ((f.y - y) * sc - 10) + 'px';
          d.style.width = (f.w * sc + 20) + 'px'; d.style.height = (f.h * sc + 20) + 'px';
        });
      }
    } else if (s.type === 'end') {
      b.parts.forEach((p, i) => { if (i === 1) return; const k = ease((lt - [0, 0, 0.9, 1.1, 1.3][i]) / 0.45); p.style.opacity = k; p.style.transform = `translateY(${(1 - k) * 30}px) scale(${i === 2 ? 0.96 + 0.04 * k : 1})`; });
      animWords(b.tws, lt, 0.2);
    }
  }
  await Promise.all(waits);
  return true;
};
window.DURATION = R.dur;
document.fonts.ready.then(() => { window.READY = true; });
</script>
</body>
</html>
